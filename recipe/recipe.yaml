context:
  version: "2.24.2"

package:
  name: pitchfork
  version: ${{ version }}

source:
  - url: https://github.com/jdx/pitchfork/archive/refs/tags/v${{ version }}.tar.gz
    sha256: bdbb8e8e6a3c87603b4ae1e81353ca9c173f6f34cddafacc5f4cac46e779cb1a

build:
  number: 2
  script:
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
    interpreter: nu
    content:
      - let prefix = $env.LIBRARY_PREFIX? | default $env.PREFIX
      # build web UI assets (`ui/dist`)
      - aube install   --dir=ui
      - aube run build --dir=ui
      # build main app and generate license data
      - cargo auditable install --path=. --root=($prefix) --no-track --locked --bins
      - cargo-bundle-licenses --format=yaml --output=./THIRDPARTY.yml
      # generate shell completions
      - if: build_platform == host_platform
        then:
          - mkdir ($prefix)/share/bash-completion/completions ($prefix)/share/fish/vendor_completions.d ($prefix)/share/zsh/site-functions
          - let bin = $prefix | path join bin/pitchfork
          - ^$bin completion bash | save ($prefix | path join share/bash-completion/completions/pitchfork)
          - ^$bin completion fish | save ($prefix | path join share/fish/vendor_completions.d/pitchfork.fish)
          - ^$bin completion zsh  | save ($prefix | path join share/zsh/site-functions/_pitchfork)

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - aube
    - cargo-auditable
    - cargo-bundle-licenses
    - nodejs
    - nushell

tests:
  - script:
      - pitchfork --help
      - pitchfork --version
  - package_contents:
      bin:
        - pitchfork
      files:
        - if: unix and build_platform == host_platform
          then:
            - share/bash-completion/completions/pitchfork
            - share/fish/vendor_completions.d/pitchfork.fish
            - share/zsh/site-functions/_pitchfork
        - if: win and build_platform == host_platform
          then:
            - Library/share/bash-completion/completions/pitchfork
            - Library/share/fish/vendor_completions.d/pitchfork.fish
            - Library/share/zsh/site-functions/_pitchfork
      strict: true

about:
  summary: Daemons with DX
  description: |
    Pitchfork is a CLI for managing daemons with a focus on developer experience.
    It can start daemons only once, auto start/stop them via a shell hook when
    entering/leaving a project directory, perform readiness checks (delay,
    output regex, HTTP endpoint, TCP port, or custom command), manage
    dependencies with topological start ordering, watch files to auto-restart
    daemons, schedule recurring tasks via cron, run lifecycle hooks, enforce
    resource limits, and expose an interactive TUI as well as a browser-based
    web UI and an MCP server for AI assistants.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://pitchfork.jdx.dev
  repository: https://github.com/jdx/pitchfork

extra:
  recipe-maintainers:
    - salim-b
